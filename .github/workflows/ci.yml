name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run is only interesting for the newest commit on a branch. The deploy job
# below opts out of this and uses its own group: cancelling a publish halfway
# is a different and worse thing than cancelling a test run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # setup-node has already restored ~/.npm, so the three packages in the
      # lockfile need no network at all. Left to itself npm contacts the
      # registry anyway -- to revalidate and to run the audit -- and from the
      # hosted runners that link is wildly unreliable: the same three packages
      # have taken 30s, 3m, 5m and 7m, and the two seven-minute installs gave up
      # on the audit without printing it. That variance was the whole of CI's
      # variance; every other step held steady. --prefer-offline spends the
      # cache we already paid for and --no-audit drops the round trip that
      # stalls, neither of which changes what gets installed.
      - run: npm ci --prefer-offline --no-audit --fund=false

      # Chromium runs everything: it is where ImageDecoder and WebCodecs are
      # complete enough to be an oracle for exact decoder output. Firefox runs
      # degrade.spec.js only, which asks the weaker and browser-appropriate
      # question -- does the format list shrink honestly (#19). WebKit runs in
      # its own job below; see the note there.
      - run: npx playwright install --with-deps chromium firefox

      - run: npm test -- --project=chromium --project=firefox

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # WebKit belongs on macOS, and not merely because it crashes on the Linux
  # runner (it does -- "Target crashed" on page load, with dependencies
  # installed). Safari exists only on Apple platforms, and WebKit's Linux port
  # uses entirely different media backends from the macOS one. A Linux WebKit
  # result would be weak evidence about Safari even if it ran, which is the
  # question #19 actually cares about.
  #
  # Still a WebKit build rather than shipping Safari -- they differ on codecs
  # Safari gets from system frameworks -- so this is a strong hint, not proof.
  webkit:
    name: WebKit degradation (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # setup-node has already restored ~/.npm, so the three packages in the
      # lockfile need no network at all. Left to itself npm contacts the
      # registry anyway -- to revalidate and to run the audit -- and from the
      # hosted runners that link is wildly unreliable: the same three packages
      # have taken 30s, 3m, 5m and 7m, and the two seven-minute installs gave up
      # on the audit without printing it. That variance was the whole of CI's
      # variance; every other step held steady. --prefer-offline spends the
      # cache we already paid for and --no-audit drops the round trip that
      # stalls, neither of which changes what gets installed.
      - run: npm ci --prefer-offline --no-audit --fund=false

      - run: npx playwright install webkit

      - run: npm test -- --project=webkit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 14

  corpus:
    name: Corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The committed .gif files must be exactly what the generator produces.
      # If they drift, either someone edited a fixture by hand or the generator
      # changed without its output being regenerated -- both make the corpus
      # untrustworthy, because expected.json describes the generator's intent.
      - name: Regenerate the corpus
        run: python3 corpus/make_corpus.py

      - name: Fail if the committed fixtures differ
        run: |
          if ! git diff --exit-code --stat corpus/; then
            echo "::error::corpus/ is not reproducible from corpus/make_corpus.py."
            echo "Run 'python3 corpus/make_corpus.py' and commit the result."
            exit 1
          fi

  # Publishing used to happen on its own, straight from the branch, with no way
  # to depend on anything: GitHub built `main` on every push and the site went
  # live whether the tests had passed or not. That is not hypothetical -- on
  # 2026-09-04 commit 9d2f6aa deployed successfully while its CI was failing.
  #
  # A branch-deploy cannot be gated, so publishing moves into this workflow,
  # where `needs` means what it says.
  deploy:
    name: Deploy to Pages
    needs: [test, webkit, corpus]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deliberately not the workflow-wide group: a publish that is half-applied
    # is worse than one that waits, so these queue rather than cancel.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The repository root, which is what the branch deploy published, so the
      # site's contents do not change with the mechanism. CNAME travels with it
      # and keeps overlay.immanuelqrw.dev pointed here.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: The deployed site works
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --fund=false

      - run: npx playwright install --with-deps chromium

      # Everything else is checked against test/serve.js on localhost, which
      # shares nothing with Pages but the bytes. This is the only thing that
      # sees content types, the http -> https redirect, the CNAME, and whether
      # the deploy actually landed -- and #88 was a 404 the whole suite missed
      # that three lines against production found at once.
      #
      # It waits for the live copy to match this checkout byte for byte, so a
      # half-applied or lagging publish is a wait rather than a false pass.
      - name: Verify overlay.immanuelqrw.dev
        run: npm run verify:deployed
